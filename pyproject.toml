[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-people-counter"
version = "1.0.0"
description = "A state-of-the-art computer vision application for real-time people counting and tracking using YOLOv8"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Computer Vision Solutions", email = "support@advancedpeoplecounter.com"},
]
maintainers = [
    {name = "Computer Vision Solutions", email = "support@advancedpeoplecounter.com"},
]
keywords = [
    "computer-vision",
    "yolo",
    "yolov8",
    "object-detection",
    "people-counting",
    "tracking",
    "opencv",
    "realtime",
    "surveillance",
    "analytics",
    "deep-learning",
    "machine-learning",
    "artificial-intelligence",
    "video-processing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
]

dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "ultralytics>=8.0.0",
    "torch>=1.13.0",
    "torchvision>=0.14.0",
    "torchaudio>=0.13.0",
    "Pillow>=8.0.0",
    "PyQt6>=6.4.0",
    "matplotlib>=3.5.0",
    "pandas>=1.5.0",
    "requests>=2.28.0",
    "seaborn>=0.11.0",
    "tqdm>=4.64.0",
    "python-dotenv>=0.19.0",
    "loguru>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.990",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
gpu = [
    "torch>=1.13.0+cu117",
    "torchvision>=0.14.0+cu117",
    "torchaudio>=0.13.0+cu117",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.990",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "torch>=1.13.0+cu117",
    "torchvision>=0.14.0+cu117",
    "torchaudio>=0.13.0+cu117",
]

[project.urls]
Homepage = "https://github.com/your-username/advanced-people-counter"
Documentation = "https://github.com/your-username/advanced-people-counter/docs"
Repository = "https://github.com/your-username/advanced-people-counter"
Issues = "https://github.com/your-username/advanced-people-counter/issues"
Changelog = "https://github.com/your-username/advanced-people-counter/blob/main/CHANGELOG.md"

[project.scripts]
people-counter = "advanced_people_counter.ui.main_window:main"
people-counter-cli = "advanced_people_counter.core.counter:main_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["advanced_people_counter*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2",
    "ultralytics.*",
    "PyQt6.*",
    "matplotlib.*",
    "scipy.*",
    "pandas.*",
    "seaborn.*",
    "loguru.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
